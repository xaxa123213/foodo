<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Foodo" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f6f4f1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <title>Foodo</title>
</head>
<body>
  <div id="app">
    <header class="app-header" id="app-header">
      <div class="brand">
        <span class="brand-mark">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.87V20h12v-6.13"/><path d="M6 14a4 4 0 0 1 .84-7.91 5 5 0 0 1 10.32 0A4 4 0 0 1 18 14z"/><path d="M6 17h12"/></svg>
        </span>
        <span class="brand-name">Foodo</span>
      </div>
      <button id="add-btn" class="add-btn" aria-label="Add recipe">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>New</span>
      </button>
    </header>

    <main id="view"></main>
  </div>

  <!-- Recipe editor sheet -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-inner">
      <div class="grabber"></div>
      <div class="sheet-head">
        <button id="cancel-btn" class="text-btn">Cancel</button>
        <h2 id="sheet-title">New recipe</h2>
        <button id="save-btn" class="pill-btn">Save</button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label class="field-label" for="r-name">Recipe name</label>
          <input id="r-name" class="input" type="text" placeholder="e.g. Spaghetti Bolognese" autocomplete="off" />
        </div>

        <div class="field">
          <label class="field-label" for="r-folder">Folder</label>
          <div class="select-wrap">
            <select id="r-folder" class="input"></select>
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="r-ingredients">Ingredients <span class="hint">One per line</span></label>
          <textarea id="r-ingredients" class="input" rows="6" placeholder="200g spaghetti&#10;500g mince&#10;1 onion"></textarea>
        </div>

        <div class="field">
          <label class="field-label" for="r-steps">Method <span class="hint">One step per line</span></label>
          <textarea id="r-steps" class="input" rows="6" placeholder="Boil the pasta&#10;Brown the mince&#10;Mix and serve"></textarea>
        </div>

        <div class="field">
          <label class="field-label" for="r-notes">Notes <span class="hint">Optional</span></label>
          <textarea id="r-notes" class="input" rows="3" placeholder="Serves 4 · 20 min"></textarea>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <button class="tab active" data-tab="recipes">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
      <span>Cookbook</span>
    </button>
    <button class="tab" data-tab="home">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="discover">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
      <span>Discover</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <script src="app.js?v=7"></script>
</body>
</html>
