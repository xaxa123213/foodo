<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Foodo — style mockups</title>
<style>
  html,body{margin:0;background:#e8e3de;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  h1{text-align:center;font-size:16px;color:#555;padding:18px 0 4px;margin:0}
  .row{display:flex;gap:24px;justify-content:center;padding:24px;flex-wrap:wrap}
  .frame{width:300px;height:620px;border-radius:36px;overflow:hidden;background:#fff;
    box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;border:9px solid #111}
  .frame iframe{width:100%;height:100%;border:0}
  .cap{text-align:center;font-size:13px;font-weight:700;color:#444;margin-top:8px}
</style>
</head>
<body>
  <h1>Pick a vibe</h1>
  <div class="row">
    <div><div class="frame"><iframe src="./a.html"></iframe></div><div class="cap">A — Clean iOS</div></div>
    <div><div class="frame"><iframe src="./b.html"></iframe></div><div class="cap">B — Bold &amp; Colorful</div></div>
    <div><div class="frame"><iframe src="./c.html"></iframe></div><div class="cap">C — Dark &amp; Sleek</div></div>
  </div>
</body>
</html>
